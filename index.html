<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Wee — vuestro club de lectura: proponéis libros, votáis, leéis por capítulos y debatís sin spoilers." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#efe6d2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wee" />
    <title>Wee — club de lectura</title>
    <link rel="canonical" href="https://wee-app-v1.vercel.app/" />

    <!-- Previsualización al compartir el enlace (Open Graph: WhatsApp, Telegram,
         Facebook, Slack, Discord…). og:image debe ser una URL ABSOLUTA a un
         raster (1200×630). Para regenerar la imagen:
         npx @resvg/resvg-js-cli public/og-image.svg public/og-image.png -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wee" />
    <meta property="og:title" content="Wee — vuestro club de lectura" />
    <meta property="og:description" content="Proponéis libros, votáis, leéis por capítulos y debatís sin spoilers. Sin anuncios ni rankings." />
    <meta property="og:url" content="https://wee-app-v1.vercel.app/" />
    <meta property="og:image" content="https://wee-app-v1.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wee — vuestro club de lectura" />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wee — vuestro club de lectura" />
    <meta name="twitter:description" content="Proponéis libros, votáis, leéis por capítulos y debatís sin spoilers." />
    <meta name="twitter:image" content="https://wee-app-v1.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Wee — vuestro club de lectura" />
    <!-- Fuentes: preconnect + link en el <head> (antes iban por @import dentro de
         global.css, que encadenaba round-trips y retrasaba el primer pintado). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Special+Elite&display=swap"
    />
    <!-- Splash instantáneo: se pinta con el HTML, antes de que monte React, para
         que no haya un fogonazo en blanco. React reemplaza #root al montar y este
         marcado desaparece solo, empalmando con la pantalla de carga animada. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(820px 340px at 5% 0%, rgb(47 106 102 / 10%) 0%, transparent 70%),
          radial-gradient(720px 300px at 95% 100%, rgb(47 106 102 / 8%) 0%, transparent 68%),
          linear-gradient(160deg, #efe6d2, #e9dec8 55%, #efe6d2 100%);
      }
      #boot-splash span {
        font-family: "Special Elite", "Courier New", monospace;
        font-size: clamp(2.6rem, 12vw, 3.8rem);
        line-height: 1;
        color: #2a241b;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash"><span>wee.</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
